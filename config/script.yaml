# 口播稿配置
# 稿子是"念出来"的，不是"读起来"的：短句、口语、有数字。

rate_per_minute: 260        # 中文口播语速，用来把时长换算成字数
default_seconds: 290        # 默认 4 分 50 秒，落在"5 分钟左右"

# 段落结构。seconds 是权重，会按目标总时长等比缩放。
# 这套顺序同时服务两类人：老板听前两段的判断和代价，学习者听中间的做法。
structure:
  - heading: 钩子
    seconds: 8
    hint: 一句话。必须是结论或反常识，不能是"大家好""今天聊聊"。直接扔观点。
  - heading: 现象
    seconds: 45
    hint: 你亲眼看到的具体场景，带一个真实数字。用"我有个客户…"这类第一人称开头，不要引用行业报告。
  - heading: 判断
    seconds: 70
    hint: 为什么会这样。讲你的结论，允许和主流说法不一样。这决定了老板要不要继续听。
  - heading: 三步做法
    seconds: 100
    hint: 三步，每步一个动作，能照着做。这是给学习者的部分，不能空喊"要重视""要转型"。
  - heading: 代价
    seconds: 47
    hint: 不这么做的成本，或有人踩过的坑。给具体金额、时间、人力。
  - heading: 收尾
    seconds: 20
    hint: 一句反问或一句邀请，不要喊关注。两类人都能接住。

# 这些词一出现就像 AI 写的，生成后会被检查
banned:
  - 首先
  - 其次
  - 总而言之
  - 总之
  - 综上所述
  - 赋能
  - 闭环
  - 抓手
  - 在当今时代
  - 随着科技的发展
  - 让我们一起
  - 值得深思
