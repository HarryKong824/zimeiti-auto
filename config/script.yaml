# 口播稿配置
# 稿子是"念出来"的，不是"读起来"的：短句、口语、有数字。

rate_per_minute: 260        # 中文口播语速，用来把时长换算成字数
default_seconds: 290        # 默认 4 分 50 秒，落在"5 分钟左右"

# 段落结构。seconds 是权重，会按目标总时长等比缩放。
# 标准见 skills/zimeiti-auto/references/口播稿标准.md：主角是观众，案例只当证据。
structure:
  - heading: 钩子
    seconds: 8
    hint: 观众的动作或处境，10 到 14 字。不要写公司名、年份、"今天聊聊"，也不要拿"你信吗"硬凑问句。
  - heading: 现象
    seconds: 45
    hint: 观众自己会看到的东西，带一个具体数字（时间、钱、次数）。不要编造客户或对话；不确定就写成"你自己导一次数据"。
  - heading: 判断
    seconds: 70
    hint: 一句反常识结论，允许和主流说法相反，用一句短句砸下去。案例只能是证据，不能当主体。
  - heading: 三步做法
    seconds: 100
    hint: 三步，每步一个具体动作，明天就能做。不写"要重视""要转型"这类空话。
  - heading: 代价
    seconds: 47
    hint: 不这么做的成本，或别人踩过的坑。给具体金额、时间、人力。
  - heading: 收尾
    seconds: 20
    hint: 给一个动作或一句立场，让观众知道下一步做什么。禁止总结句、禁止喊关注。

# 这些词一出现就像 AI 写的，生成后会被检查
banned:
  - 首先
  - 其次
  - 总而言之
  - 总之
  - 综上所述
  - 赋能
  - 闭环
  - 抓手
  - 在当今时代
  - 在这个时代
  - 随着科技的发展
  - 让我们一起
  - 值得深思
  - 真正值得
  - 本质上
  - 值得注意的是
  - 底层逻辑
  - 核心逻辑
  - 拥抱变化
