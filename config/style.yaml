video:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: veryfast
  shot_min: 3.0
  shot_max: 9.0

subtitle:
  font: "Microsoft YaHei"
  size: 58
  outline: 3
  margin_v: 220
  chars_per_line: 16

style:
  # 固定风格是自动化的前提：改这里会改变整片观感
  bg: ["#0B0F17", "#131A26", "#0F141D"]
  accent: "#36D1C4"
  text: "#F2F5FA"
  muted: "#8A94A6"
  font_bold: "C:/Windows/Fonts/msyhbd.ttc"
  font_regular: "C:/Windows/Fonts/msyh.ttc"
  brand: "老孔 · AI落地交接"

cover:
  width: 1080
  height: 1440
  title_size: 92
  max_lines: 3
  variants: 2        # 每个尺寸生成几张备选封面（做 A/B 测试），1=只出主封面
  # 每个平台要求不同比例，一次全出：竖版给抖音/小红书，横版给 B站/视频号
  sizes:
    - key: vertical
      width: 1080
      height: 1440
    - key: wide
      width: 1920
      height: 1080

image:
  width: 1152
  height: 2048
