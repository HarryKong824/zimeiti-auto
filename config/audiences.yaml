# 双变现目标 → 同一条视频出两种表述
# 决策者：有 AI 转型需求的老板/负责人
# 学习者：想学这套方法并愿意付费的人
audiences:
  decision:
    name: 决策者版
    goal: 让有转型需求的老板 3 秒内看懂"这跟我有什么关系"
    tone: 结论先行，讲成本、风险、收益、落地步骤；少术语多类比；不推销，给判断依据
    structure: ["痛点一句话", "结论一句话", "代价或收益的数字", "三步落地", "一句反问"]
  learner:
    name: 学习者版
    goal: 让想学的人觉得"这个我能照着做"
    tone: 第一人称，讲踩过的坑和具体动作，给可直接复制的清单
    structure: ["反常识开头", "我踩的坑", "三步做法", "可直接用的模板", "求关注"]
